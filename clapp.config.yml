# Configuration of the @clapp/ai-workflow-mcp server (see IAppConfig in @clapp/core).
#
# Plugins of every type come from **sources**, each anchored at its own root:
#   - `appRoot`  — the package directory that holds this config file, never `process.cwd()`;
#   - `library`  — the directory of the npm package named by `library`, resolved from the
#                  application root through the `node_modules` chain (npm-workspaces hoisting
#                  and monorepos work without relative paths);
#   - `project`  — the root of the project the launcher runs in: the nearest `package.json`
#                  above the working directory. Its plugins live in `plugins/<type>/**`; when
#                  there is no project, the source is simply empty and the run does not fail.
#
# The `schemas` section (`ISchemaConfig`, next to `plugins`) declares the data schemas of the
# commands:
#   - `sources` — a list of the same kind as the sources of a plugin type; its patterns point
#                 at the schema files, which live in `schemas/**` of the root of their source.
#                 The schemas of `@clapp/ai-workflow-plugins` come from that package, the ones
#                 of a project from `schemas/**` of the project root (empty when absent);
#   - `formatters` — the map from the `$id` of a schema to the id of the formatter plugin that
#                 renders the data it describes. A command names the shape of its data with
#                 `dataSchema`, and this map decides which formatter renders it, so a command
#                 stays independent of the formatter set a host loads. The ids below are the
#                 same as in the CLI host, but the discovery patterns of `formatter` point at
#                 the MCP set (`src/plugins/formatter/mcp/**`), so the map resolves to the
#                 plain-text formatters of the protocol stream. A schema id without a file, a
#                 duplicate `$id` and a formatter id that no loaded plugin carries fail the
#                 start-up; a command whose schema has no entry in the map is skipped and the
#                 reason is reported.
#
# The MCP host carries no command of its own: the commands are plugins of the library package
# `@clapp/ai-workflow-plugins` with their schemas in `schemas/**` of that package, while the
# MCP formatters are per-file plugin modules of `@clapp/common`
# (`packages/common/src/plugins/formatter/mcp/**`) and the contexts of `@clapp/common`
# (`packages/common/src/plugins/context/**`); the built bundles are not discovery targets.
# The set of sources and the disable rules are identical to the CLI host.
name: ai-workflow-mcp
description: MCP server for AI-assisted development workflow automation (opencode artifacts)
version: 0.0.1
plugins:
  command:
    sources:
      - type: library
        library: '@clapp/ai-workflow-plugins'
        patterns:
          - src/plugins/command/**/*.plugin.{js,ts}
      - type: project
        patterns:
          - plugins/command/**/*.plugin.{js,ts}
  command-argument:
    sources:
      - type: library
        library: '@clapp/common'
        patterns:
          - src/plugins/command-argument/**/*.plugin.{js,ts}
      - type: project
        patterns:
          - plugins/command-argument/**/*.plugin.{js,ts}
  context:
    sources:
      - type: library
        library: '@clapp/common'
        patterns:
          - src/plugins/context/**/*.context.{js,ts}
      - type: project
        patterns:
          - plugins/context/**/*.context.{js,ts}
  formatter:
    sources:
      - type: library
        library: '@clapp/common'
        patterns:
          - src/plugins/formatter/mcp/**/*.plugin.{js,ts}
      - type: project
        patterns:
          - plugins/formatter/**/*.plugin.{js,ts}
schemas:
  sources:
    - type: library
      library: '@clapp/ai-workflow-plugins'
      patterns:
        - schemas/**/*.schema.yml
    - type: project
      patterns:
        - schemas/**/*.schema.yml
  formatters:
    task-list: table
    task-todo: table
    skill-list: table
    task-add: key-value
    skill-add: key-value
    npm-info: key-value
    init: key-value
    brief: ordered-list
